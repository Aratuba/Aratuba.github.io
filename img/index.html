<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e; /* fundo escuro caso a imagem não preencha */
        }

        .wallpaper {
            max-width: 95vw;
            max-height: 95vh;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            object-fit: contain; /* garante que a imagem inteira seja visível */
        }
    </style>
</head>
<body>
    <img src="/img/wallpaper-para-computadores.png" alt="Wallpaper para computadores" class="wallpaper">
</body>
</html>
