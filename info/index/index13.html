<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área e Perímetro do Retângulo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 320px;
    }

    a {
      display: block;
      padding: 14px 20px;
      background: #fff;
      color: #4a3f8f;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <h1>Área e Perímetro do Retângulo</h1>

  <div class="links">
    <a href="https://www.geogebra.org/classic?lang=pt" target="_blank" rel="noopener">GeoGebra Classic</a>
    <a href="/isaque/HORTA.ggb">HORTA.ggb</a>
  </div>
</body>
</html>
